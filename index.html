<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MzikiHub - Music & Audio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0b0b0f;
    color:white;
}

header{
    background:#15151c;
    padding:25px 15px;
    text-align:center;
    border-bottom:1px solid #292933;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#ff2755;
}

header p{
    color:#aaa;
    margin-top:8px;
}

.container{
    width:94%;
    max-width:900px;
    margin:auto;
}

.search-box{
    display:flex;
    margin:25px 0;
    gap:8px;
}

.search-box input{
    flex:1;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.search-box button{
    border:none;
    background:#ff2755;
    color:white;
    padding:0 20px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

.countries{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.country{
    flex:1;
    padding:12px;
    border:1px solid #33333d;
    background:#15151c;
    color:white;
    border-radius:10px;
    cursor:pointer;
}

.country.active{
    background:#ff2755;
    border-color:#ff2755;
}

h2{
    margin:25px 0 15px;
}

.artist{
    background:#15151c;
    border:1px solid #292933;
    padding:18px;
    border-radius:15px;
    margin-bottom:15px;
}

.artist h3{
    font-size:21px;
    margin-bottom:5px;
}

.country-name{
    color:#aaa;
    font-size:14px;
    margin-bottom:15px;
}

.song{
    background:#0f0f14;
    padding:14px;
    border-radius:12px;
    margin-top:10px;
}

.song-title{
    font-weight:bold;
    margin-bottom:10px;
}

.buttons{
    display:flex;
    gap:8px;
}

.play,
.download{
    flex:1;
    padding:11px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.play{
    background:#ff2755;
    color:white;
    border:none;
}

.download{
    background:transparent;
    color:white;
    border:1px solid #444;
}

.no-results{
    text-align:center;
    color:#aaa;
    padding:30px;
    display:none;
}

footer{
    text-align:center;
    color:#777;
    padding:35px 10px;
    margin-top:30px;
    border-top:1px solid #222;
}
</style>
</head>

<body>

<header>
    <div class="logo">🔥 Mziki<span>Hub</span></div>
    <p>Tafuta wasanii na nyimbo unazopenda</p>
</header>

<div class="container">

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Andika jina la msanii au wimbo..."
            oninput="searchMusic()"
        >
        <button onclick="searchMusic()">TAFUTA</button>
    </div>

    <div class="countries">
        <button class="country active" onclick="filterCountry('all',this)">
            🌍 WOTE
        </button>

        <button class="country" onclick="filterCountry('Tanzania',this)">
            🇹🇿 TANZANIA
        </button>

        <button class="country" onclick="filterCountry('South Africa',this)">
            🇿🇦 SOUTH AFRICA
        </button>
    </div>

    <h2>🔥 Wasanii na Nyimbo</h2>

    <div id="musicList"></div>

    <div id="noResults" class="no-results">
        😔 Hakuna msanii au wimbo uliopatikana.
    </div>

</div>

<footer>
    © 2026 MzikiHub - Music & Audio
</footer>

let currentCountry = "all";

function displayMusic(){

    const list = document.getElementById("musicList");
    const search = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    list.innerHTML = "";

    let found = 0;

    artists.forEach((artist,index)=>{

        if(
            currentCountry !== "all" &&
            artist.country !== currentCountry
        ){
            return;
        }

        const artistMatch =
            artist.name.toLowerCase().includes(search);

        const matchingSongs = artist.songs.filter(song =>
            song.toLowerCase().includes(search)
        );

        if(search !== "" && !artistMatch && matchingSongs.length === 0){
            return;
        }

        found++;

        const songsToShow =
            search !== "" && matchingSongs.length > 0
            ? matchingSongs
            : artist.songs;

        let songsHTML = "";

        songsToShow.forEach(song=>{

            songsHTML += `
                <div class="song">

                    <div class="song-title">
                        🎵 ${song}
                    </div>

                    <div class="buttons">

                        <button
                            class="play"
                            onclick="playSong('${song.replace(/'/g,"\\'")}')">
                            ▶️ Play
                        </button>

                        <button
                            class="download"
                            onclick="downloadSong('${song.replace(/'/g,"\\'")}')">
                            ⬇️ Download
                        </button>

                    </div>

                </div>
            `;
        });

        list.innerHTML += `
            <div class="artist">

                <h3>🎤 ${artist.name}</h3>

                <div class="country-name">
                    ${artist.country === "Tanzania" ? "🇹🇿 Tanzania" : "🇿🇦 South Africa"}
                </div>

                ${songsHTML}

            </div>
        `;
    });

    document.getElementById("noResults").style.display =
        found === 0 ? "block" : "none";
}

function searchMusic(){
    displayMusic();
}

function filterCountry(country,button){

    currentCountry = country;

    document
        .querySelectorAll(".country")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayMusic();
}

function playSong(song){

    alert(
        "▶️ Unataka kucheza: " +
        song +
        "\n\nTutaunganisha audio halisi hapa."
    );
}

function downloadSong(song){

    alert(
        "⬇️ Download ya " +
        song +
        "\n\nTutaunganisha file ya audio hapa."
    );
}

displayMusic();

</script>
